;==================================================
; custom.ini
; GL-MT5000 + OpenClash + SubConverter-Extended
; 兼容优先版本
;==================================================

;--------------------------------------------------
; 1. 规则集
;--------------------------------------------------

; 自定义直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/itollei/rules/refs/heads/main/Direct.list

; AI
ruleset=🤖 AI,https://raw.githubusercontent.com/itollei/rules/refs/heads/main/AI.list

; Speedtest
ruleset=♻️ Speedtest,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Speedtest/Speedtest.list

; Copilot / Bing
ruleset=💧 Copilot,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Bing.list

; YouTube
ruleset=📹 YouTube,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list

; GitHub
ruleset=👨🏿‍💻 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list

; Google
ruleset=🍀 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list

; Netflix
ruleset=🎥 Netflix,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list

; 游戏
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Epic.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Origin.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Sony.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Nintendo.list

; 国内媒体
ruleset=🎞️ 国内媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.list

; 国外媒体
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

; GFW
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list

; 中国 IP
ruleset=🎯 全球直连,[]GEOIP,CN

; 最终规则
ruleset=🐟 漏网之鱼,[]FINAL


;--------------------------------------------------
; 2. 主策略组
;--------------------------------------------------

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🩹 故障切换`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点

custom_proxy_group=🎯 全球直连`select`[]DIRECT

custom_proxy_group=🤖 AI`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🚀 节点选择

custom_proxy_group=♻️ Speedtest`select`[]🎯 全球直连`[]🚀 节点选择

custom_proxy_group=📹 YouTube`select`[]♻️ 自动选择`[]🚀 节点选择

custom_proxy_group=👨🏿‍💻 GitHub`select`[]♻️ 自动选择`[]🚀 节点选择`[]🎯 全球直连

custom_proxy_group=🍀 Google`select`[]♻️ 自动选择`[]🚀 节点选择

custom_proxy_group=💧 Copilot`select`[]♻️ 自动选择`[]🚀 节点选择

custom_proxy_group=🎥 Netflix`select`[]♻️ 自动选择`[]🚀 节点选择

custom_proxy_group=🎮 游戏平台`select`[]♻️ 自动选择`[]🚀 节点选择`[]🎯 全球直连

custom_proxy_group=🎞️ 国内媒体`select`[]DIRECT

custom_proxy_group=🌍 国外媒体`select`[]♻️ 自动选择`[]🚀 节点选择

custom_proxy_group=🐟 漏网之鱼`select`[]♻️ 自动选择`[]🩹 故障切换`[]🎯 全球直连


;--------------------------------------------------
; 3. 自动节点组
;--------------------------------------------------

custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🩹 故障切换`fallback`.*`https://www.gstatic.com/generate_204`300,,50


;--------------------------------------------------
; 4. 地区节点组
;--------------------------------------------------

custom_proxy_group=🇭🇰 香港节点`url-test`(?i)(香港|Hong Kong|HongKong|HK|HKG|🇭🇰)`https://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇹🇼 台湾节点`url-test`(?i)(台湾|台灣|Taiwan|Tai Wan|TW|TPE|🇹🇼|🇨🇳)`https://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇯🇵 日本节点`url-test`(?i)(日本|东京|大阪|Japan|JP|NRT|HND|KIX|🇯🇵)`https://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)(新加坡|狮城|Singapore|SG|SIN|🇸🇬)`https://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇺🇸 美国节点`url-test`(?i)(美国|洛杉矶|纽约|西雅图|硅谷|United States|USA|US|LAX|SFO|SEA|🇺🇸)`https://www.gstatic.com/generate_204`300,,50


;--------------------------------------------------
; 5. 必要标志
;--------------------------------------------------

enable_rule_generator=true
overwrite_original_rules=true
