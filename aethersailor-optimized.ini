; OpenClash / subconverter | 清晰分组版
; 注意：INI 本身不能自动删除无节点的地区策略组。
; 如需彻底清理，请在转换后执行 prune_groups.py。
[custom]
; ===== 1. 本地和国内优先直连 =====
ruleset=🎯 国内直连,[]GEOSITE,private
ruleset=🎯 国内直连,[]GEOIP,private
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,home.arpa
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,lan
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,local
ruleset=🎯 国内直连,[]GEOSITE,category-ai-cn
ruleset=🎯 国内直连,[]GEOSITE,category-games@cn
ruleset=🎯 国内直连,[]GEOSITE,category-game-platforms-download
; ===== 2. 细分国外服务（必须位于宽泛国际规则前） =====
ruleset=🤖 国外AI,[]GEOSITE,openai
ruleset=🤖 国外AI,[]GEOSITE,anthropic
ruleset=🤖 国外AI,[]GEOSITE,google-gemini
ruleset=🤖 国外AI,[]GEOSITE,xai
ruleset=🤖 国外AI,[]GEOSITE,category-ai-!cn
ruleset=🎬 国外流媒体,[]GEOSITE,youtube
ruleset=🎬 国外流媒体,[]GEOSITE,netflix
ruleset=🎬 国外流媒体,[]GEOSITE,disney
ruleset=🎬 国外流媒体,[]GEOSITE,hbo
ruleset=🎬 国外流媒体,[]GEOSITE,primevideo
ruleset=🎬 国外流媒体,[]GEOSITE,apple-tvplus
ruleset=🎬 国外流媒体,[]GEOSITE,spotify
ruleset=🎬 国外流媒体,[]GEOSITE,bahamut
ruleset=🎬 国外流媒体,[]GEOSITE,tiktok
ruleset=🎮 国外游戏,[]GEOSITE,steam
ruleset=🎮 国外游戏,[]GEOSITE,category-games
ruleset=🌍 其他国外服务,[]GEOSITE,github
ruleset=🌍 其他国外服务,[]GEOSITE,category-dev
ruleset=🌍 其他国外服务,[]GEOSITE,telegram
ruleset=🌍 其他国外服务,[]GEOSITE,discord
ruleset=🌍 其他国外服务,[]GEOSITE,category-communication
ruleset=🌍 其他国外服务,[]GEOSITE,category-social-media-!cn
ruleset=🌍 其他国外服务,[]GEOSITE,gfw
ruleset=🌍 其他国外服务,[]GEOSITE,geolocation-!cn
ruleset=🌍 其他国外服务,[]GEOIP,telegram
; ===== 3. 国内兜底与未匹配流量 =====
ruleset=🎯 国内直连,[]GEOSITE,cn
ruleset=🎯 国内直连,[]GEOIP,cn
ruleset=🐟 兜底策略,[]FINAL
; ===== 4. 基础策略 =====
custom_proxy_group=🎯 国内直连`select`[]DIRECT
; 地区策略：有匹配节点时列出节点，无匹配节点时暂时只有 DIRECT，后处理删除
custom_proxy_group=🇭🇰 香港节点`select`(🇭🇰|香港|港服|港线|Hong.?Kong|HKG|(?:^|[^A-Za-z])HK(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇺🇸 美国节点`select`(🇺🇸|美国|美西|美东|洛杉矶|纽约|硅谷|西雅图|United.?States|USA|(?:^|[^A-Za-z])US(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇯🇵 日本节点`select`(🇯🇵|日本|东京|大阪|Japan|JPN|(?:^|[^A-Za-z])JP(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇸🇬 新加坡节点`select`(🇸🇬|新加坡|狮城|Singapore|(?:^|[^A-Za-z])SG(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇹🇼 台湾节点`select`(🇹🇼|台湾|台北|高雄|Taiwan|(?:^|[^A-Za-z])TW(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇰🇷 韩国节点`select`(🇰🇷|韩国|首尔|Korea|(?:^|[^A-Za-z])KR(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇨🇦 加拿大节点`select`(🇨🇦|加拿大|温哥华|多伦多|Canada|(?:^|[^A-Za-z])CA(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇬🇧 英国节点`select`(🇬🇧|英国|伦敦|Britain|United.?Kingdom|(?:^|[^A-Za-z])UK(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇫🇷 法国节点`select`(🇫🇷|法国|巴黎|France|(?:^|[^A-Za-z])FR(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇩🇪 德国节点`select`(🇩🇪|德国|法兰克福|Germany|(?:^|[^A-Za-z])DE(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇳🇱 荷兰节点`select`(🇳🇱|荷兰|阿姆斯特丹|Netherlands|(?:^|[^A-Za-z])NL(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇹🇷 土耳其节点`select`(🇹🇷|土耳其|伊斯坦布尔|Turkey|(?:^|[^A-Za-z])TR(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🇷🇺 俄罗斯节点`select`(🇷🇺|俄罗斯|莫斯科|Russia|(?:^|[^A-Za-z])RU(?:[^A-Za-z]|$))`[]DIRECT
custom_proxy_group=🌐 其他地区`select`(🇦🇺|澳大利亚|澳洲|Australia|🇮🇳|印度|India|🇲🇾|马来西亚|Malaysia|🇹🇭|泰国|Thailand|🇻🇳|越南|Vietnam|🇵🇭|菲律宾|Philippines|🇧🇷|巴西|Brazil|🇮🇹|意大利|Italy|🇪🇸|西班牙|Spain|🇨🇭|瑞士|Switzerland|🇸🇪|瑞典|Sweden|🇳🇿|新西兰|New.?Zealand|🇮🇩|印尼|Indonesia|🇦🇪|阿联酋|Dubai)`[]DIRECT
; ===== 5. 手动选择 / 自动测速 =====
custom_proxy_group=🚀 手动选择`select`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🇰🇷 韩国节点`[]🇨🇦 加拿大节点`[]🇬🇧 英国节点`[]🇫🇷 法国节点`[]🇩🇪 德国节点`[]🇳🇱 荷兰节点`[]🇹🇷 土耳其节点`[]🇷🇺 俄罗斯节点`[]🌐 其他地区`[]DIRECT`.*
custom_proxy_group=♻️ 流媒体自动`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ 游戏自动`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ 国外自动`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ AI自动`url-test`(🇺🇸|🇯🇵|🇸🇬|🇨🇦|🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇦🇺|美国|美西|美东|日本|东京|大阪|新加坡|狮城|加拿大|英国|伦敦|德国|法国|荷兰|澳大利亚|澳洲|United.?States|USA|Japan|Singapore|Canada|Britain|Germany|France|Netherlands|Australia|(?:^|[^A-Za-z])(US|JP|SG|CA|UK|DE|FR|NL|AU)(?:[^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,,50
; ===== 6. 业务策略（自动为默认第一项，可手动覆盖） =====
custom_proxy_group=🎬 国外流媒体`select`[]♻️ 流媒体自动`[]🚀 手动选择`[]DIRECT
custom_proxy_group=🎮 国外游戏`select`[]♻️ 游戏自动`[]🚀 手动选择`[]DIRECT
custom_proxy_group=🤖 国外AI`select`[]♻️ AI自动`[]🚀 手动选择`[]DIRECT
custom_proxy_group=🌍 其他国外服务`select`[]♻️ 国外自动`[]🚀 手动选择`[]DIRECT
custom_proxy_group=🐟 兜底策略`select`[]DIRECT`[]🚀 手动选择`[]♻️ 国外自动
; ===== 7. 过滤订阅状态节点 =====
exclude_remarks=(剩余流量|到期时间|套餐到期|官网|订阅更新|Traffic Remaining|Expire Date)
enable_rule_generator=true
overwrite_original_rules=true
