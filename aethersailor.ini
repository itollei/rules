; OpenClash / Mihomo - simple five-group routing
; Converter: ghcr.io/jungley8/subconverter-ng
; Encoding: UTF-8
; Rules are evaluated from top to bottom. Unmatched traffic defaults to DIRECT.
;
; Notes:
; 1. url-test selects the lowest latency candidate, not guaranteed highest throughput.
; 2. AI matches selected region keywords in node NAMES. A matching region does not guarantee service access.
; 3. No remote rule files: all rules below are standard inline GEOSITE/GEOIP/MATCH rules.

[custom]
; ===== Private/local network and domestic services: DIRECT =====
ruleset=🎯 国内直连,[]GEOSITE,private
ruleset=🎯 国内直连,[]GEOIP,private
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,home.arpa
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,lan
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,local
ruleset=🎯 国内直连,[]GEOSITE,category-ai-cn
ruleset=🎯 国内直连,[]GEOSITE,category-games@cn
ruleset=🎯 国内直连,[]GEOSITE,category-game-platforms-download

; ===== Foreign AI: selected region candidates only =====
ruleset=🤖 国外AI,[]GEOSITE,openai
ruleset=🤖 国外AI,[]GEOSITE,anthropic
ruleset=🤖 国外AI,[]GEOSITE,google-gemini
ruleset=🤖 国外AI,[]GEOSITE,xai
ruleset=🤖 国外AI,[]GEOSITE,category-ai-!cn

; ===== Foreign streaming: latency-based auto selection =====
ruleset=🎬 国外流媒体,[]GEOSITE,youtube
ruleset=🎬 国外流媒体,[]GEOSITE,netflix
ruleset=🎬 国外流媒体,[]GEOSITE,disney
ruleset=🎬 国外流媒体,[]GEOSITE,hbo
ruleset=🎬 国外流媒体,[]GEOSITE,primevideo
ruleset=🎬 国外流媒体,[]GEOSITE,apple-tvplus
ruleset=🎬 国外流媒体,[]GEOSITE,spotify
ruleset=🎬 国外流媒体,[]GEOSITE,bahamut
ruleset=🎬 国外流媒体,[]GEOSITE,tiktok

; ===== Foreign games: domestic rules above take precedence =====
ruleset=🎮 国外游戏,[]GEOSITE,steam
ruleset=🎮 国外游戏,[]GEOSITE,category-games

; ===== Domestic catch-all =====
ruleset=🎯 国内直连,[]GEOSITE,cn
ruleset=🎯 国内直连,[]GEOIP,cn

; ===== Remaining traffic: manual choice, default DIRECT =====
ruleset=🐟 兜底手动选择,[]FINAL

; ===== Exactly five proxy groups =====
; Domestic must stay DIRECT only, avoiding loops.
custom_proxy_group=🎯 国内直连`select`[]DIRECT

; URL-test probes delay. All node names are candidates, excluding informational entries globally.
custom_proxy_group=🎬 国外流媒体`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🎮 国外游戏`url-test`.*`https://www.gstatic.com/generate_204`300,,50

; AI: mainstream supported-region candidates by name (US/JP/SG/CA/UK/DE/FR/NL/AU/TW).
; Edit this ONE regex if your subscriptions use other country labels.
custom_proxy_group=🤖 国外AI`url-test`(?i)(🇺🇸|🇯🇵|🇸🇬|🇨🇦|🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇦🇺|🇹🇼|美国|美西|美东|洛杉矶|纽约|硅谷|西雅图|日本|东京|大阪|新加坡|狮城|加拿大|英国|伦敦|德国|法国|荷兰|澳大利亚|澳洲|悉尼|台湾|台北|USA|United.?States|Japan|Singapore|Canada|Britain|Germany|France|Netherlands|Australia|Taiwan|US[-_0-9]|JP[-_0-9]|SG[-_0-9]|CA[-_0-9]|UK[-_0-9]|DE[-_0-9]|FR[-_0-9]|NL[-_0-9]|AU[-_0-9]|TW[-_0-9])`https://www.gstatic.com/generate_204`300,,50

; Default DIRECT; individual nodes remain available for manual override.
custom_proxy_group=🐟 兜底手动选择`select`[]DIRECT`.*

; Avoid fake nodes such as remaining traffic / expiry notifications.
exclude_remarks=(剩余流量|到期时间|套餐到期|官网|订阅更新|流量倍率说明|Traffic Remaining|Expire Date)

enable_rule_generator=true
overwrite_original_rules=true
