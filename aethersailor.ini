; OpenClash / Mihomo multi-scenario routing
; Target: ghcr.io/jungley8/subconverter-ng:latest
; Version: 1.2.0 (2026-10-31)
; Remote Aethersailor YAML rulesets; use expand=true for inline rules, NOT rule-providers.
; Use with target=clash and expand=true.
; NOTE: GEOIP rules intentionally omit no-resolve to avoid version-specific rendering bugs.
;
; Put more specific rules before broader ones; MATCH must be last.
[custom]

; ===== local/private networks =====
ruleset=🎯 国内直连,[]GEOSITE,private
ruleset=🎯 国内直连,[]GEOIP,private
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,home.arpa
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,lan
ruleset=🎯 国内直连,[]DOMAIN-SUFFIX,local

; ===== Aethersailor maintained direct/proxy lists (expand=true) =====
; Use YAML versions, not .mrs, for subconverter-ng inline expansion.
ruleset=🎯 国内直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
